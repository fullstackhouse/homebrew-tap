# Points Casks/paseo-fsh.rb at the newest FSH desktop release of fullstackhouse/paseo.
# Polls instead of being triggered by that repo, so no cross-repo token is needed:
# the default GITHUB_TOKEN can read the public release and push to this repo.
name: Bump paseo-fsh

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-paseo-fsh
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cask=Casks/paseo-fsh.rb
          release=$(gh api repos/fullstackhouse/paseo/releases/latest)
          tag=$(jq -r .tag_name <<<"$release")
          case "$tag" in fsh-*) ;; *) echo "Latest release $tag is not an FSH build"; exit 0 ;; esac
          asset=$(jq -c '[.assets[] | select(.name | endswith("-arm64.dmg"))][0]' <<<"$release")
          [ "$asset" != "null" ] || { echo "No arm64 DMG on $tag yet"; exit 0; }
          version=${tag#fsh-}
          url=$(jq -r .browser_download_url <<<"$asset")
          sha256=$(jq -r '.digest // empty' <<<"$asset" | sed 's/^sha256://')
          if [ -z "$sha256" ]; then
            curl -fsSL "$url" -o /tmp/paseo.dmg
            sha256=$(sha256sum /tmp/paseo.dmg | cut -d' ' -f1)
          fi
          if grep -q "version \"$version\"" "$cask"; then
            echo "Already at $version"
            exit 0
          fi
          sed -i \
            -e "s|^  version \".*\"|  version \"$version\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$sha256\"|" \
            -e "s|^  url \".*\"|  url \"$url\"|" \
            "$cask"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "paseo-fsh $version"
          git push
